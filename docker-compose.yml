# 售后工单 Agent 一体化编排：应用 + Postgres(pgvector) + Redis
# 用法：
#   1. 准备 .env（可由 .env.example 复制，先保持 fake 模型 / fake embedding 跑通链路）
#   2. docker compose build
#   3. docker compose run --rm app npm run db:init
#   4. docker compose run --rm app npm run seed
#   5. docker compose up -d
#   6. 健康检查：curl http://127.0.0.1:3204/health
name: agent-harness-gongdan

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ahg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # 仅 Compose 内网信任免密；端口不对宿主机/公网暴露
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ahg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ahg-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - ahg-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: ahg-app
    env_file: .env
    environment:
      # Compose 内网服务名覆盖 .env 里的本机默认值
      DATABASE_URL: postgresql://postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379
      # 放行非本机 DB 主机（仅在 Compose 内网生效；默认本机校验保持不变）
      DATABASE_ALLOW_REMOTE: "true"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3204:3204"
    networks:
      - ahg-net
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: ahg-proxy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme-challenge:/var/www/acme:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - ahg-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  ahg-net:
    driver: bridge
